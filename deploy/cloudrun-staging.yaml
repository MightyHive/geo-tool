# Reference spec for geo-audit-staging (applied via scripts/deploy_cloud_run_staging.sh).
# Single Cloud Run *service* runs UI + API + audit pipeline (SSE, up to 60m).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: geo-audit-staging
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/timeout: "3600"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      serviceAccountName: geo-audit-tool@geo-tool-emea-ds.iam.gserviceaccount.com
      containerConcurrency: 2
      timeoutSeconds: 3600
      containers:
        - image: europe-west1-docker.pkg.dev/geo-tool-emea-ds/geo-audit/web:staging
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: staging
            - name: GEO_DATA_ROOT
              value: /var/geo-data
            - name: AUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-oauth-client-id-geo-tool
                  key: latest
            - name: AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-oauth-client-secret-geo-tool
                  key: latest
            - name: AUTH_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-cookie-secret-geo-tool
                  key: latest
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: geo-data
              mountPath: /var/geo-data
      volumes:
        - name: geo-data
          csi:
            driver: gcsfuse.run.googleapis.com
            volumeAttributes:
              bucketName: geo-tool-emea-ds-geo-audit-staging
